<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="momo">
  <!-- 占位 momo 头像（日系治愈 / 兔耳精灵风）。作者可直接覆盖本文件,无需改代码。
       引用路径: /avatar/momo-avatar.svg (由 vite publicDir 提供) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0e9ff" />
      <stop offset="100%" stop-color="#d9ccff" />
    </radialGradient>
  </defs>
  <!-- 紫色软底圈 -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)" />
  <!-- 兔耳 -->
  <ellipse cx="22" cy="14" rx="4.5" ry="10" fill="#c0afff" transform="rotate(-8 22 14)" />
  <ellipse cx="42" cy="14" rx="4.5" ry="10" fill="#c0afff" transform="rotate(8 42 14)" />
  <!-- 内耳粉 -->
  <ellipse cx="22" cy="16" rx="1.8" ry="5" fill="#ffc4d2" transform="rotate(-8 22 16)" opacity="0.85" />
  <ellipse cx="42" cy="16" rx="1.8" ry="5" fill="#ffc4d2" transform="rotate(8 42 16)" opacity="0.85" />
  <!-- 脸（奶油白） -->
  <circle cx="32" cy="36" r="17" fill="#fbf8f5" />
  <!-- 半闭眼(左) -->
  <path d="M23.5 34 Q26 36.5 28.5 34" stroke="#3d3851" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <!-- 半闭眼(右) -->
  <path d="M35.5 34 Q38 36.5 40.5 34" stroke="#3d3851" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <!-- 腮红 -->
  <circle cx="23" cy="40" r="2.2" fill="#ffd0d8" opacity="0.7" />
  <circle cx="41" cy="40" r="2.2" fill="#ffd0d8" opacity="0.7" />
  <!-- 微笑嘴 -->
  <path d="M29.5 42 Q32 44 34.5 42" stroke="#3d3851" stroke-width="1.5" stroke-linecap="round" fill="none" />
</svg>
