[package]
name = "aipet"
version = "0.0.0"
description = "AI 桌宠 — 由你亲手塑造、会主动关心你、能和你一起玩的 AI 桌宠"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aipet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# M1-D1 最小依赖：仅 tauri 核心 + 序列化 + 错误处理 + 时间 + windows DPAPI 占位。
# M1-D5 #5：接入 SQL（plugin + sqlx）+ frontmatter 解析 + ULID（messages.id）。
# 业务依赖（reqwest / global-shortcut / 等）按 milestone 节奏后置：B.1 LLMProvider / N InteractionRouter / 等。
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# #5 PersonaService / MemoryService / NicknameService（M1 W1 数据层）：
# - tauri-plugin-sql：建库 + WAL + migrations runner（schema 见 migrations/001_init.sql）
# - gray_matter：解 .soul.md frontmatter（YAML feature 即可，砍掉非必要依赖）
# - sqlx：service 层短期连接读写（plugin 的 DbPool 在 2.x 不公开，自开 sqlx）；版本必须与 plugin 内部 sqlx 一致（0.8）
# - ulid：messages.id 走 ULID（时间序，利于 (conversation_id, created_at) 索引）
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
gray_matter = { version = "0.2", default-features = false, features = ["yaml"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
ulid = "1"

# #10 桌宠位置防抖保存：tokio time 用于 200ms debounce 的 sleep + JoinHandle abort。
# #12 LLM 流式 + 取消：tokio::select! 宏需要 `macros` feature；非 dev 编译路径下
# 必须显式启用（dev-deps tokio 启了 macros 让 cargo test 能跑，但非 test build 不会
# 继承 dev-deps features，会撞 "cannot find `select` in `tokio`"）。
tokio = { version = "1", features = ["time", "rt", "macros"] }

# #11 全局快捷键：注册 Ctrl+Alt+Space → emit shortcut:chat（PRD §7.2.2）。
tauri-plugin-global-shortcut = "2"

# #12 LLMProvider：OpenAI 兼容协议流式 + 取消（ADR-018 Layer 1）。
# - reqwest：HTTP 客户端；rustls-tls 不依赖 OpenSSL（Windows MSVC 友好），stream feature 取 bytes_stream
# - eventsource-stream：SSE event 解析（OpenAI chat completions stream:true 走 text/event-stream）
# - futures-util：StreamExt::next 用于 SSE event 循环
# - async-trait：trait 中 async fn + dyn LLMProvider 兼容（M1 暂只 1 个 provider，但 ChatService #13 起按 dyn 注册）
# - tokio-util：CancellationToken（#10 已加 tokio time + rt feature；这里加 tokio-util 提供 CancellationToken）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
futures-util = "0.3"
async-trait = "0.1"
tokio-util = "0.7"
# bytes：reqwest::Response::bytes_stream() yields Result<bytes::Bytes, _>；
# process_event_stream 在 trait bound 里直接引用，必须是 [dependencies]（非 dev-deps）。
bytes = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

# #5 DB 集成测试 dev-deps：
# - tempfile：每个测试一份独立 .db 文件，避免共享状态串味；Drop 自动清理
# - tokio macros + rt：async 测试用 #[tokio::test] 宏
[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
